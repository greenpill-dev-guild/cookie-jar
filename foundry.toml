# Root Foundry configuration: lets editors and `forge` invoked from the repo root find the
# contracts. The bun scripts always run forge from ./contracts, whose foundry.toml is the
# source of truth; keep the two in sync.

[profile.default]
solc_version = "0.8.30"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 1
bytecode_hash = "none"
cbor_metadata = false
cache = true
src = "contracts/src"
out = "contracts/out"
libs = ["lib"]
test = "contracts/test"
script = "contracts/script"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/",
    "forge-std/=lib/forge-std/src/",
    "halmos-cheatcodes/=lib/openzeppelin-contracts/lib/halmos-cheatcodes/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "@superfluid-finance/ethereum-contracts/=lib/protocol-monorepo/packages/ethereum-contracts/contracts/",
    "universal-router/=lib/universal-router/",
    "permit2/=lib/permit2/",
]
skip = ["**/certora/**/*.sol", "lib/openzeppelin-contracts/certora/**"]
fs_permissions = [{ access = "read", path = "./contracts/" }]

[profile.dev]
solc_version = "0.8.30"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
cache = true
src = "contracts/src"
out = "contracts/out"
libs = ["lib"]
test = "contracts/test"
script = "contracts/script"
skip = ["**/certora/**/*.sol", "lib/openzeppelin-contracts/certora/**"]
fs_permissions = [{ access = "read", path = "./contracts/" }]
