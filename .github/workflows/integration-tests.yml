name: Integration Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  # Anvil's public test account #0. Not a secret; never use it outside local chains.
  ANVIL_DEPLOYER: '0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
  ANVIL_DEPLOYER_KEY: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
  FOUNDRY_PROFILE: dev

jobs:
  integration-tests:
    name: Client integration tests against Anvil
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-bun

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Apply OpenZeppelin compatibility shims
        run: ./scripts/oz-compat.sh

      - name: Start Anvil
        run: |
          anvil --host 0.0.0.0 --port 8545 --chain-id 31337 --accounts 10 --balance 1000 \
            --gas-limit 30000000 --gas-price 0 > contracts/anvil.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
              http://127.0.0.1:8545 > /dev/null 2>&1; then
              echo "Anvil ready"; exit 0
            fi
            sleep 1
          done
          echo "Anvil failed to start"; exit 1

      - name: Deploy local contracts
        working-directory: contracts
        run: |
          forge build
          forge script script/DeployLocal.s.sol:DeployLocalScript \
            --rpc-url http://127.0.0.1:8545 --broadcast --force \
            --sender "$ANVIL_DEPLOYER" --private-key "$ANVIL_DEPLOYER_KEY"

      - name: Publish deployment files and generate client types
        run: |
          ./scripts/create-deployment-file.sh
          ./scripts/copy-deployment.sh
          cd client && bun run generate

      - name: Run integration tests
        working-directory: client
        run: bun run test:integration

      - name: Verify deployment file
        run: |
          test -f client/public/contracts/local-deployment.json
          jq -r '.contracts | to_entries[] | "  \(.key): \(.value)"' client/public/contracts/local-deployment.json

      - name: Stop Anvil
        if: always()
        run: pkill anvil || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            client/test-results/
            client/coverage/
            contracts/anvil.log
          retention-days: 7
