name: Smart Contract Tests

on:
  push:
    paths:
      - 'contracts/**'
      - 'lib/**'
      - 'foundry.toml'
      - 'scripts/oz-compat.sh'
      - '.github/workflows/contract-tests.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'lib/**'
      - 'foundry.toml'
      - 'scripts/oz-compat.sh'
      - '.github/workflows/contract-tests.yml'
  workflow_dispatch:

jobs:
  contract-tests:
    name: Foundry build, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOUNDRY_PROFILE: dev
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Apply OpenZeppelin compatibility shims
        run: ./scripts/oz-compat.sh

      - name: Build (dev profile) with sizes
        working-directory: contracts
        run: forge build --sizes

      - name: Test with gas report
        working-directory: contracts
        run: forge test -vvv --gas-report

      - name: Coverage (lcov)
        working-directory: contracts
        run: forge coverage --report lcov
        continue-on-error: true # coverage instrumentation is best effort; tests above are the gate

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./contracts/lcov.info
          flags: contract-tests
          name: contract-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-artifacts
          path: |
            contracts/out/
            contracts/lcov.info
          retention-days: 7
