name: Code Quality

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-bun

      - name: Lint (oxlint + Next rules)
        run: bun lint

      - name: Format check (Biome)
        run: bun format:check

      - name: Type check
        run: bun type-check
