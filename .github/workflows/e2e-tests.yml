name: End-to-End Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 2 * * *' # Nightly 02:00 UTC
  workflow_dispatch:

env:
  # Anvil's public test account #0. Not a secret; never use it outside local chains.
  ANVIL_DEPLOYER: '0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
  ANVIL_DEPLOYER_KEY: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
  FOUNDRY_PROFILE: dev

jobs:
  e2e-tests:
    name: Playwright against Anvil
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-bun

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Apply OpenZeppelin compatibility shims
        run: ./scripts/oz-compat.sh

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps

      - name: Start Anvil and deploy
        run: |
          anvil --host 0.0.0.0 --port 8545 --chain-id 31337 --accounts 10 --balance 1000 \
            --gas-limit 30000000 --gas-price 0 > contracts/anvil.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
              http://127.0.0.1:8545 > /dev/null 2>&1 && break
            sleep 1
          done
          cd contracts
          forge build
          forge script script/DeployLocal.s.sol:DeployLocalScript \
            --rpc-url http://127.0.0.1:8545 --broadcast \
            --sender "$ANVIL_DEPLOYER" --private-key "$ANVIL_DEPLOYER_KEY"
          cd ..
          ./scripts/create-deployment-file.sh
          ./scripts/copy-deployment.sh

      - name: Start the client
        run: |
          cd client
          bun run generate
          NODE_ENV=development bun run dev > ../dev.log 2>&1 &
          cd ..
          for i in $(seq 1 60); do
            curl -s http://localhost:3000 > /dev/null 2>&1 && { echo "Next.js ready"; exit 0; }
            sleep 2
          done
          echo "Next.js failed to start"; cat dev.log; exit 1

      - name: Run E2E tests
        run: ./scripts/test-e2e.sh --skip-setup --ci
        env:
          CI: true

      - name: Stop services
        if: always()
        run: |
          pkill anvil || true
          pkill -f "next dev" || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 30

      - name: Upload environment logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: environment-logs
          path: |
            contracts/anvil.log
            dev.log
          retention-days: 7
