# Foundry configuration for the Cookie Jar contracts.
# Run forge from this directory (the bun scripts do): `cd contracts && forge build`.
# Production builds use the default profile (size-optimised, solc pinned);
# tests and local development use the dev profile (same solc, faster compile).

[profile.default]
solc_version = "0.8.30"   # Pinned: production bytecode must be reproducible
evm_version = "cancun"    # Required for Uniswap v4 transient storage
via_ir = true
optimizer = true
optimizer_runs = 1        # Aggressively optimise for size to stay under the EIP-170 limit
bytecode_hash = "none"    # Drop the metadata hash to save ~53 bytes
cbor_metadata = false
cache = true
src = "src"
out = "out"
libs = ["../lib"]
test = "test"
script = "script"
skip = ["**/certora/**/*.sol", "../lib/openzeppelin-contracts/certora/**"]
# Scripts only read jar configs under ./config; nothing writes to the client tree any more.
fs_permissions = [{ access = "read", path = "./" }]

[profile.dev]
solc_version = "0.8.30"   # Same compiler as production so tests exercise the shipped semantics
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200      # Faster compiles; bytecode size is checked with the default profile
cache = true
src = "src"
out = "out"
libs = ["../lib"]
test = "test"
script = "script"
skip = ["**/certora/**/*.sol", "../lib/openzeppelin-contracts/certora/**"]
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
arbitrum = "https://arb1.arbitrum.io/rpc"
arbitrum-sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
base-sepolia = "${BASE_SEPOLIA_RPC_URL}"
sepolia = "${ETHEREUM_SEPOLIA_RPC_URL}"
celo-alfajores = "${CELO_ALFAJORES_RPC_URL}"

# One Etherscan V2 key covers every explorer in the Etherscan family (Arbiscan included).
[etherscan]
arbitrum = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }
arbitrum-sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }
base-sepolia = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
